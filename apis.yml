aid: gable
name: Gable
description: Gable is an all-in-one workplace management platform that connects people, spaces,
  and data with AI-driven insights for hybrid and in-office teams. The platform provides desk
  and room booking, room scheduling, visitor management, and event planning, plus on-demand
  access to a global network of 20,000+ premium coworking spaces across 900+ cities. Gable
  surfaces office-utilization analytics that compare intended versus actual attendance to inform
  real estate and cost decisions, and integrates with Slack, Microsoft Teams, Outlook, Google
  Calendar, Okta, Workday, Brivo, and Rippling. A Gable booking API plus SSO and SCIM support
  enable programmatic and enterprise administration of the workplace estate.
